"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
scan_timeout = 300
command_timeout = 300

# Modules absent from `format` never run, so none need `disabled = true`.
# Each segment is bracketed by its own black wedges, so a hidden module leaves no orphan separator.
format = """
[╭─░](fg:bright-black)\
$directory\
([](fg:wedge bg:bg_dark_cream)$git_branch$git_state[](fg:bg_dark_cream bg:wedge))\
([](fg:wedge bg:bright_grn_clr)$nodejs$python$java$scala[](fg:bright_grn_clr bg:wedge))\
[](fg:wedge)
[╰](fg:bright-black)$character"""

palette = "dark"

[palettes.dark]
bg_brown = "#D4A373"
bg_dark_cream = "#b7b7a4"
bright_grn_clr = "#adc178"
red_clay_clr = "#6f1d1b"
txt_clr = "#1c1917"
navy = "#394260"
ink = "#212736"
wedge = "#000000"

[character]
success_symbol = "[](fg:bright-black) "
error_symbol = " [](red) "

[directory]
truncation_symbol = "../"
# worktrunk names worktrees <repo>.<user>-<branch>; the branch segment already shows the user prefix.
substitutions = [{ from = "tj-kolleh-ck-", to = "" }]
format = "[▒](fg:bright-black bg:txt_clr)[](fg:navy bg:ink)[](fg:ink bg:bg_brown)[$path](bg:bg_brown fg:txt_clr)[$read_only]($read_only_style)[](fg:bg_brown bg:wedge)"

[git_branch]
symbol = "  "
truncation_length = 28
format = "[$symbol$branch](bg:bg_dark_cream fg:txt_clr)"

[git_state]
format = "[  $state( $progress_current/$progress_total)](bg:bg_dark_cream fg:txt_clr)"

# Detection is narrowed so versions show only at a project root and sbt projects don't also match Java.
[nodejs]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_extensions = []
symbol = " "
format = "[ ${symbol}(${version})](bold fg:red_clay_clr bg:bright_grn_clr)"

[python]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "poetry.lock"]
detect_folders = [".venv"]
detect_extensions = []
symbol = " "
format = "[ $symbol ${pyenv_prefix}(${version} )($virtualenv ) ](bold fg:red_clay_clr bg:bright_grn_clr)"

[java]
detect_files = ["pom.xml", "build.gradle", "gradlew", ".java-version"]
detect_extensions = []
symbol = " "
format = "[ ${symbol}(${version})](bold fg:red_clay_clr bg:bright_grn_clr)"

[scala]
detect_files = ["build.sbt", ".scala-version"]
detect_folders = []
detect_extensions = []
symbol = " "
format = "[ ${symbol}(${version})](bold fg:red_clay_clr bg:bright_grn_clr)"
