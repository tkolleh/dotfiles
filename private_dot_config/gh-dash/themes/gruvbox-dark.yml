# ~/.config/gh-dash/themes/gruvbox-dark.yml
theme:
  colors:
    text:
      primary: "#ebdbb2"    # Standard text (Light Cream)
      secondary: "#a89984"  # Muted text (Warm Gray)
      inverted: "#282828"   # Used on selected/highlighted items (Dark Background)
      faint: "#928374"      # Dimmed text (Darker Gray)
      warning: "#fabd2f"    # Issue/PR Warning (Gruvbox Yellow)
      success: "#b8bb26"    # Merged/Approved (Gruvbox Green)
      actor: "#83a598"      # Usernames (Gruvbox Blue)
    background:
      selected: "#504945"   # Highlighted row (Lighter Background)
    border:
      primary: "#665c54"    # Main container borders
      secondary: "#504945"  # Inner dividers
      faint: "#3c3836"      # Very subtle borders
